    <title>تطبيق خروج متوسطة وثانوية نخبة الشمال الأهلية</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Dev SW nuke must run BEFORE any module imports. An old Workbox CacheFirst
      otherwise serves mismatched React copies and breaks hooks.
    -->
    <script type="module">
      ;(async function boot() {
        var host = location.hostname
        var isLocal = host === 'localhost' || host === '127.0.0.1'
        if (isLocal && 'serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations()
          var hadSw = regs.length > 0 || !!navigator.serviceWorker.controller
          await Promise.all(regs.map(function (reg) { return reg.unregister() }))
          if ('caches' in window) {
            var keys = await caches.keys()
            await Promise.all(keys.map(function (key) { return caches.delete(key) }))
          }
          if (hadSw && sessionStorage.getItem('isteathan-dev-sw-nuked') !== '1') {
            sessionStorage.setItem('isteathan-dev-sw-nuked', '1')
            location.reload()
            return
          }
        }
        await import('/src/main.tsx')
      })()
    </script>
  </body>
</html>
